spring.application.name=BE
server.port=8080

# Microsoft SQL Server Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=demodb;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=12345
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate and JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# JWT Configuration
app.jwt.secret = ${APP_JWT_SECRET}
app.jwt.expiration-ms = 86400000

# Swagger Configuration
springdoc.api-docs.path = /v3/api-docs
springdoc.swagger-ui.path = /swagger-ui.html

# MoMo Sandbox Configuration
app.momo.partner-code=${MOMO_PARTNER_CODE:MOMO}
app.momo.access-key=${MOMO_ACCESS_KEY:F8BBA842ECF85}
app.momo.secret-key=${MOMO_SECRET_KEY:K951B6PE1waDMi640xX08PD3vg6EkVlz}
app.momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
app.momo.query-endpoint=${MOMO_QUERY_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/query}
app.momo.redirect-url=${MOMO_REDIRECT_URL:http://localhost:8080/payment/momo/return}
app.momo.ipn-url=${MOMO_IPN_URL:http://localhost:8080/api/payments/momo/ipn}
app.momo.return-success-url=${MOMO_RETURN_SUCCESS_URL:http://localhost:5173/payment/result?status=success}
app.momo.return-failure-url=${MOMO_RETURN_FAILURE_URL:http://localhost:5173/payment/result?status=failed}
