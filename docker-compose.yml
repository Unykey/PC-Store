version: '3.8'

services:
  # 1. Vector Database (Qdrant)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: pc_store_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # 2. Relational Database (PostgreSQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: pc_store_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: PcStore@2026
      POSTGRES_DB: pc_store
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  qdrant_data:
  postgres_data: